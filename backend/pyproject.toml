[project]
name = "git-iterm2"
version = "0.1.0"
description = "Source control panel for the iTerm2 toolbelt"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.6",
]

[project.optional-dependencies]
iterm = ["iterm2>=2.7"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-aiohttp>=1.0.5",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_iterm2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# `iterm2` is an optional runtime dependency (installed only via the `iterm`
# extra) with no type stubs; `git_iterm2.iterm.focus` imports it lazily, at
# runtime only, inside `ActiveSessionTracker.run()`.
module = "iterm2"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["ASYNC240"]
