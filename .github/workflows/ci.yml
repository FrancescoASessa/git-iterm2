name: CI

on:
  # `branches` is required, not decorative: a `push:` carrying only tag
  # filters does not fire for branch pushes at all, so with `tags-ignore`
  # alone this workflow ran on no push to `main` (or any other branch).
  # `**` rather than `*` so branch names containing `/` match.
  #
  # `v*` tags stay excluded on purpose: `release.yml` calls the very same
  # reusable workflow before it publishes, so a tag is fully gated without
  # running every job twice.
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
