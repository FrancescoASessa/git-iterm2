name: CI

on:
  # `branches` is required, not decorative: a `push:` carrying only tag
  # filters does not fire for branch pushes at all, so with `tags-ignore`
  # alone this workflow ran on no push to `main` (or any other branch).
  # `**` rather than `*` so branch names containing `/` match.
  #
  # `v*` tags stay excluded on purpose: `release.yml` calls the very same
  # reusable workflow before it publishes, so a tag is fully gated without
  # running every job twice.
  #
  # `paths-ignore`: a change that only touches prose (root Markdown, docs/,
  # .claude/) cannot change a test result, so it does not start the macOS
  # matrix. Tags are unaffected -- path filters do not apply to tag pushes,
  # and `release.yml` runs the suite itself.
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".claude/**"

permissions:
  contents: read

# One in-flight CI run per ref: pushing again to a branch cancels the suite
# for the commit that has just been superseded instead of running two full
# macOS matrices for a result nobody will read.
#
# The group keys on `github.ref`, not on the branch name shared by the push
# and pull_request events. Collapsing those two into one group would let a
# branch push cancel the run attached to the pull request, and a cancelled
# run reports as a failed check on the PR -- worse than the duplicate it
# would save. `github.workflow` keeps this group from colliding with
# `release.yml`'s.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No `timeout-minutes` here: a job that calls a reusable workflow does not
  # accept one. Each called job sets its own in `tests.yml`.
  tests:
    uses: ./.github/workflows/tests.yml
