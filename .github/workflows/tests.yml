name: Tests

# The single definition of "this branch is green": backend, web, end-to-end
# and packaging. Called by `ci.yml` (pushes and pull requests) and by
# `release.yml` (before a `v*` tag publishes anything), so a release is
# gated by exactly the same checks a pull request is -- not by a copy of
# them that can drift.
#
# There is deliberately no `concurrency:` block here. A concurrency group
# declared in a reusable workflow is shared by every caller, so a push to a
# branch could cancel -- or sit behind -- the very test run that is gating a
# release. Each caller scopes its own group instead (see `ci.yml` and
# `release.yml`).
#
# Every action is pinned to a commit SHA with the tag in a trailing comment.
# A tag like `@v4` is mutable: whoever controls the action's repository can
# repoint it at new code, which would then run with this workflow's token.
# The SHA is what makes an update a reviewable diff instead of a silent one;
# the comment is what makes the diff readable. Dependabot (see
# `.github/dependabot.yml`) rewrites both together.
#
# The major of each pin is the Node 24 one (checkout v7, setup-node v7,
# upload-artifact v7, cache v6): GitHub removes the Node 20 runtime from its
# runners on 2026-09-23, and an action declaring `using: node20` has nothing
# to run on after that.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # `uv sync` plus ~30s of ruff/mypy/pytest. Roughly 5x the expected run,
    # so a slow dependency download is not a failure, while a wedged job is
    # bounded far short of the 6h default -- which on macOS bills at 10x.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes or fetches again, so leaving the
          # token in .git/config only widens what a compromised dependency
          # could reach.
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # `auto` (the default) silently disables the cache on tag pushes,
          # which is exactly how `release.yml` calls this workflow -- the one
          # run where a cold cache costs the most. `true` enables it always.
          enable-cache: true
          # Key on the backend's own lockfile, not the default `**/*.lock`
          # sweep: those are the only two files that can change what
          # `uv sync` resolves here.
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Lint (ruff check)
        working-directory: backend
        run: uv run ruff check src tests

      - name: Lint (ruff format)
        working-directory: backend
        run: uv run ruff format --check src tests

      - name: Type check (mypy)
        working-directory: backend
        run: uv run mypy src

      - name: Test (pytest)
        working-directory: backend
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    # `npm ci` plus lint, typecheck, unit tests and a vite build; minutes,
    # not tens of minutes, even with a cold npm cache.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Format check
        working-directory: web
        run: npm run format:check

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Generated API types are current
        working-directory: web
        run: npm run check:types-current

      - name: Unit tests
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

  e2e:
    needs: web
    runs-on: macos-latest
    # The longest job: `npm ci`, a vite build, a backend `uv sync`, a
    # Chromium download on a cache miss, and 11 specs whose per-test budget
    # is 30s (plus one retry in CI). 30 minutes absorbs a cold cache and a
    # slow browser download without letting a hung browser burn hours of
    # macOS runner time.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # global-setup.ts spawns `uv run python -m git_iterm2.standalone` and
      # gives it a 20s timeout to print its listen URL. Syncing the backend
      # venv here, rather than letting the first `uv run` do it lazily, keeps
      # that first-boot cost out of the timeout window.
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Install web dependencies and build
        working-directory: web
        run: npm ci && npm run build

      # The browser build is tied to the *resolved* Playwright version, so
      # the cache key has to come from the lockfile -- `package.json` only
      # carries the `^1.48.0` range, which would keep serving stale browsers
      # after a minor bump. `playwright-core` (which actually owns the
      # browser revisions) is locked to the same version by @playwright/test.
      - name: Resolve the Playwright version
        id: playwright
        working-directory: web
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          if [[ -z "${VERSION}" || "${VERSION}" == "undefined" ]]; then
            echo "::error::Could not read the @playwright/test version from web/package-lock.json." >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Playwright ${VERSION}"

      # macOS puts the downloaded browsers here (Linux uses ~/.cache/ms-playwright).
      # No `restore-keys`: a partial restore would hand this job the browsers
      # of a *different* Playwright version, which the runtime refuses to use
      # anyway, so a miss is cheaper and less confusing than a near-miss.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium

      # A cache hit restores the browser binaries but not the host packages a
      # browser needs. That distinction only exists on Linux -- on macOS
      # `--with-deps` has nothing to install -- so this step is a no-op today
      # and exists so a move to an Ubuntu runner does not quietly lose the
      # system dependencies that `--with-deps` was installing.
      - name: Install Playwright system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true' && runner.os == 'Linux'
        working-directory: web
        run: npx playwright install-deps chromium

      - name: Run e2e tests
        working-directory: web
        run: npm run e2e

      # Without this a red e2e run is a wall of text and nothing else. The
      # config (web/playwright.config.ts) writes a trace on the first retry,
      # a screenshot on failure and the HTML report under these two
      # directories; uploading them is what makes a CI-only failure
      # reproducible locally (`npx playwright show-trace`).
      # `if-no-files-found: ignore` because a failure *before* the specs run
      # (npm ci, the build, the backend sync) leaves nothing to upload, and
      # an upload error there would bury the real one.
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          # Long enough to survive a weekend and a Monday triage, short
          # enough that traces and videos do not accumulate in storage.
          retention-days: 14

  package:
    needs: web
    runs-on: macos-latest
    # A full `npm ci` plus vite build inside build-archive.sh, then the
    # packaging test which runs that script a second time.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            backend/pyproject.toml

      # No --skip-web-build: this is the job's only SPA build. It runs
      # `npm ci && npm run build` internally (see packaging/build-archive.sh),
      # so this job never builds the SPA a second time.
      - name: Build the archive
        run: bash packaging/build-archive.sh

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      # `tests/test_packaging.py` runs the build script end to end and
      # inspects the archive. It needs a prebuilt `web/dist`, which the step
      # above has just produced -- which is why it runs here and not in the
      # `backend` job, where it would (and did) skip in silence.
      # GIT_ITERM2_REQUIRE_PACKAGING_TEST refuses that skip: if the bundle
      # is ever missing here, the job fails instead of passing vacuously.
      - name: Test the packaging pipeline
        working-directory: backend
        env:
          GIT_ITERM2_REQUIRE_PACKAGING_TEST: "1"
        run: uv run pytest -q tests/test_packaging.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GitPanel.zip
          path: dist/GitPanel.zip*
          if-no-files-found: error
