name: Release

on:
  push:
    tags:
      - "v*"

# Every action below is pinned to a commit SHA with its tag in a trailing
# comment: a tag is mutable, and this is the one workflow whose token can
# publish. Majors are the Node 24 ones, since the runners drop Node 20 on
# 2026-09-23. See the same note in `tests.yml`.
#
# Read-only by default. The write scopes a release needs -- and the two extra
# scopes provenance attestation needs -- are granted on the `release` job
# alone (see below), so `tests` and `check-version`, which run third-party
# actions and a build, never hold a token that can publish anything.
permissions:
  contents: read

# Deliberately *not* cancellable, unlike `ci.yml`. A cancelled release run
# can leave a published release with some assets uploaded and no attestation,
# or a tag whose artifacts nobody can reproduce -- a state a human then has to
# unpick by hand. A wasted runner minute is the cheaper failure. The group is
# still declared so two runs for the same tag (a re-run, or a tag force-moved
# and re-pushed) queue behind each other instead of racing to upload the same
# assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing is published until the branch is green. `ci.yml` ignores `v*`
  # tags and this workflow had no test job at all, so a tag used to build
  # and publish a release without a single check having run: a broken
  # commit could ship to everyone who installs it. Calling the same
  # reusable workflow `ci.yml` calls means a release is gated by exactly
  # the checks a pull request is -- including the packaging test -- with no
  # second copy of them to drift.
  #
  # No `timeout-minutes` here: a job that calls a reusable workflow does not
  # accept one (GitHub rejects the workflow outright). The called jobs carry
  # their own, in `tests.yml`.
  tests:
    uses: ./.github/workflows/tests.yml

  # Its own job, running alongside `tests` rather than after it: a
  # mistyped tag is knowable in seconds and must not cost a full suite
  # before it is reported. `release` needs both.
  check-version:
    runs-on: ubuntu-latest
    # A checkout and two greps.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails fast, before setting up node or building anything, if the tag
      # doesn't agree with the version build-archive.sh will embed in the
      # archive (it reads the same backend/pyproject.toml line). Otherwise a
      # forgotten version bump ships a GitPanel.zip that silently reports
      # the wrong version to everyone who installs the release.
      - name: Check tag matches backend/pyproject.toml version
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"

          PYPROJECT_LINE="$(grep -m1 '^version' backend/pyproject.toml || true)"
          if [[ -z "${PYPROJECT_LINE}" ]]; then
            echo "::error::No 'version' line found in backend/pyproject.toml." >&2
            exit 1
          fi
          PYPROJECT_VERSION="$(printf '%s\n' "${PYPROJECT_LINE}" | sed -E "s/^version[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"].*/\\1/")"
          if [[ "${PYPROJECT_VERSION}" == "${PYPROJECT_LINE}" || -z "${PYPROJECT_VERSION}" ]]; then
            echo "::error::Could not extract a version from backend/pyproject.toml: ${PYPROJECT_LINE}" >&2
            exit 1
          fi

          if [[ "${TAG_VERSION}" != "${PYPROJECT_VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match backend/pyproject.toml's version ${PYPROJECT_VERSION}. Bump pyproject.toml before tagging a release." >&2
            exit 1
          fi

          echo "Tag ${GITHUB_REF_NAME} matches backend/pyproject.toml version ${PYPROJECT_VERSION}."

  release:
    needs: [check-version, tests]
    runs-on: macos-latest
    # A full `npm ci` and vite build inside build-archive.sh, then the upload
    # and the attestation round-trip to Sigstore.
    timeout-minutes: 25
    # Job-level, so only this job can publish or sign. `permissions` at job
    # level replaces the workflow default outright, so `contents` has to be
    # restated here.
    permissions:
      # Create the release and upload its assets.
      contents: write
      # Mint the short-lived OIDC token that identifies this workflow run to
      # Sigstore; without it the attestation step cannot prove who is asking.
      id-token: write
      # Write the resulting attestation to this repository's attestation
      # store, which is what `gh attestation verify` later reads.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # softprops/action-gh-release and the attestation both talk to the
          # API with GITHUB_TOKEN; neither pushes with git.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # No --skip-web-build: this is the job's only SPA build. It runs
      # `npm ci && npm run build` internally (see packaging/build-archive.sh),
      # so this job never builds the SPA a second time.
      - name: Build the archive
        run: bash packaging/build-archive.sh

      # The archive is not code-signed and never will be -- there is no Apple
      # Developer ID certificate for this project. Provenance is the substitute
      # available to us: GitHub signs a statement, via Sigstore, binding the
      # sha256 of *this* GitPanel.zip to this repository, this commit and this
      # workflow run, and stores it where `gh attestation verify GitPanel.zip
      # --repo FrancescoASessa/git-iterm2` can check it. The published
      # `.sha256` proves the download is intact; the attestation is what ties
      # it to the source it claims to come from.
      #
      # It runs before the release is published: a release with assets but no
      # attestation is the state users cannot distinguish from a forgery, so
      # if signing fails nothing ships at all.
      #
      # This does not make macOS or iTerm2 treat the archive as signed. The
      # unsigned-import prompt is unchanged.
      - name: Attest build provenance for the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/GitPanel.zip

      # Pulls this release's notes from the matching CHANGELOG.md section
      # (Keep a Changelog style: "## [1.2.0]" or "## 1.2.0", with or
      # without a leading "v"). Fails the job with a clear message instead
      # of letting softprops/action-gh-release publish a release with an
      # empty body when the section is missing.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          ESCAPED_VERSION="$(printf '%s' "${VERSION}" | sed 's/[.[\*^$/]/\\&/g')"
          HEADING_PATTERN="^## \[?v?${ESCAPED_VERSION}\]?([[:space:]]|\$)"

          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error::CHANGELOG.md not found; cannot extract release notes for ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

          START_LINE="$(grep -nE "${HEADING_PATTERN}" CHANGELOG.md | head -n1 | cut -d: -f1 || true)"
          if [[ -z "${START_LINE}" ]]; then
            echo "::error::CHANGELOG.md has no section for version ${VERSION} (tag ${GITHUB_REF_NAME}). Add a '## ${VERSION}' (or '## [${VERSION}]') section before tagging a release." >&2
            exit 1
          fi

          REL_END_LINE="$(tail -n "+$((START_LINE + 1))" CHANGELOG.md | grep -nE '^## ' | head -n1 | cut -d: -f1 || true)"
          NOTES_FILE="$(mktemp)"
          if [[ -n "${REL_END_LINE}" ]]; then
            END_LINE=$((START_LINE + REL_END_LINE - 1))
            sed -n "$((START_LINE + 1)),${END_LINE}p" CHANGELOG.md > "${NOTES_FILE}"
          else
            sed -n "$((START_LINE + 1)),\$p" CHANGELOG.md > "${NOTES_FILE}"
          fi

          if [[ -z "$(tr -d '[:space:]' < "${NOTES_FILE}")" ]]; then
            echo "::error::CHANGELOG.md section for version ${VERSION} (tag ${GITHUB_REF_NAME}) is empty." >&2
            exit 1
          fi

          echo "notes_file=${NOTES_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/GitPanel.zip
            dist/GitPanel.zip.sha256
            packaging/install.sh
          body_path: ${{ steps.notes.outputs.notes_file }}
          fail_on_unmatched_files: true
